---
jackpot:
  ticket-price: 10000
  interval: 7200
tax:
  jackpot: 0.1
  coinflip: 5.0
settings:
  server:
    auto-inventory:
      enabled: true
souls:
  enabled: true
  tracker-lore: "&r&8> &r&7Souls: {souls}"
  soulgem:
    require-matching-book-group: false
  # tier1 / tier2 / tier3 apply to item types: Soul Gem (Stable), Efficiency Soul Conduit, Overload Soul Conduit.
  # Older gear merged before conduit types may still use soul-count thresholds until rebound.
  tiers:
    tier1:
      min: 1
      mode: "Stable"
      color: "&a"
      cost-multiplier: 1.0
    tier2:
      min: 10000
      mode: "Efficiency"
      color: "&6"
      cost-multiplier: 0.75
    tier3:
      min: 25000
      mode: "Overload"
      color: "&4"
      cost-multiplier: 0.5
      siphon-chance: 20
      siphon-amount: 1
  default-costs-by-group:
    mastery: 6
    exclusive: 7
  costs:
    detonate: 0
    satanstreat: 0
# moved to tebex.yml
# moved to voting.yml
death-inventory-log:
  enabled: true
  max-entries-per-player: 30
# moved to redstone.yml
audit-log:
  staff-enabled: true
  faction-enabled: true
  staff-discord-enabled: true
  staff-discord-webhook: ""
  staff-discord-muted-actions:
  - Give Item
  max-file-mb: 25
  max-backups: 5
  prune-days: 30
worlds:
  definitions:
    world_the_end:
      generator: end
      seed: ~
      preset: ""
      auto-load: true
      auto-generate: true
    crystal_cave:
      generator: flat
      seed: ~
      preset: ""
      auto-load: true
      auto-generate: true
      gamerules:
        randomtickspeed: 0
    vedum:
      generator: flat
      seed: ~
      preset: ""
      auto-load: true
      auto-generate: true
      gamerules:
        randomtickspeed: 0
    end:
      generator: normal
      seed: ~
      preset: ""
      auto-load: false
      auto-generate: false
      gamerules:
        dodaylightcycle: false
    FrostbiteValley:
      generator: flat
      seed: ~
      preset: ""
      auto-load: true
      auto-generate: true
      gamerules:
        randomtickspeed: 0
...
