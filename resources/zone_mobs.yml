settings:
  tick-interval-seconds: 8
  edge-padding: 16
  player-activation-range: 56
  default-base-alive: 3
  default-mobs-per-player: 2
  default-max-alive: 12
  default-anchor-radius: 22
  # Keep spawned mobs close to spawner Y so they don't end up on tree canopies/map ceiling.
  anchor-max-spawn-above: 3
  anchor-max-spawn-below: 8
  # Retries per spawn tick to find a valid candidate that passes all filters.
  spawn-position-attempts: 10
  elite-min-kills: 20
  elite-max-kills: 40
  elite-health-multiplier: 1.65
  elite-damage-multiplier: 1.45
  elite-speed-multiplier: 1.08
  elite-xp-multiplier: 1.75
  elite-loot-multiplier: 1.45
  elite-name-prefix: "&6&lElite &r"
  streak-broadcast-milestones:
    - 10
    - 25
    - 50
    - 100
  elite-types:
    - exploding
    - imploding
    - molten
    - frost
    - charged
    - gravitic
    - reinforced
    - leeching
    - corrupted
    - splitter

