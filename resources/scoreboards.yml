profiles:
  default:
    display: "Default"
    title: "&r&l&bGLACIA &r&fFACTIONS"
    lines:
      - "&r&7        {date}"
      - "  "
      - "&r&l&b{player_upper}"
      - "&r&b&l> &r&fRank&7: &b{rank}"
      - "&r&b&l> &r&fBalance&7: &a${balance}"
      - "&r&b&l> &r&fKDR&7: &b{kdr}"
      - "&r&b&l> &r&fPower&7: &b{power}"
      - "    "
      - "&r&l&b{faction_name_upper}"
      - "&r&b&l> &r&fMembers&7: &b{faction_members}"
      - "&r&b&l> &r&fContribute&7: &b{faction_contribution}"
      - "&r&b&l> &r&fPower&7: &b{faction_power}"
      - " "
      - "&r&f    store.etherealpe.com"
  astral_veil:
    display: "Astral Veil"
    title: "&r&l&dASTRAL &r&fVEIL"
    lines:
      - "&r&7        {date}"
      - "  "
      - "&r&l&d{player_upper}"
      - "&r&d&l> &r&fLevel&7: &d{level}"
      - "&r&d&l> &r&fFaction&7: &d{faction_name}"
      - "&r&d&l> &r&fIn Zone&7: &d{zone_players}"
      - "&r&d&l> &r&fMob Load&7: &d{zone_alive}&7/&d{zone_desired}"
      - "&r&d&l> &r&fStreak&7: &d{zone_streak}"
      - "&r&d&l> &r&fArea&7: &d{zone_safe}"
      - "&r&d&l> &r&fPvP&7: &d{zone_pvp}"
      - "&r&d&l> &r&fExit&7: &d{zone_exit}"
      - " "
      - "&r&f    store.etherealpe.com"
  compact_map:
    display: "Compact Claim Map"
    title: "&r&l&bGLACIA &r&fMAP"
    lines:
      - "&r&7      {coords_short}"
      - "  "
      - "&r&b{claim_map_1}"
      - "&r&b{claim_map_2}"
      - "&r&b{claim_map_3}"
      - "&r&b{claim_map_4}"
      - "&r&b{claim_map_5}"
      - "    "
      - "&r&b&l> &r&fZone&7: &b{zone_name}"
      - "&r&b&l> &r&fFaction&7: &b{faction_name}"
      - "&r&b&l> &r&fPower&7: &b{power}"
      - "&r&b&l> &r&fKDR&7: &b{kdr}"
      - " "
      - "&r&7Legend &fX&r&7=You &aO&r&7=Own &bA&r&7=Ally &cE&r&7=Enemy &7N&r&7=Claim &8.&r&7=Wild"
automatic:
  - profile: "astral_veil"
    when:
      zone: "endfall"
tokens:
  hint:
    - "{date} {player_upper} {rank} {balance} {kdr} {power} {level}"
    - "{faction_name} {faction_name_upper} {faction_members} {faction_power} {faction_contribution}"
    - "{zone_name} {zone_recommended} {zone_unlock} {zone_pvp} {zone_safe} {zone_alive} {zone_desired} {zone_players} {zone_streak} {zone_exit} {theme_name_upper} {coords_short}"
    - "{claim_map_1} ... {claim_map_5}"
