items:
  frost_admin_blade:
    aliases:
      - frostblade
      - frost_admin
    material: diamond_sword
    category: admin_items
    category-display: "Admin Items"
    name: "&r&b&lFrost Admin Blade"
    lore:
      - "&r&8Admin Config Item"
      - "&r&7Example custom sword loaded from"
      - "&r&7the &fadmin_items.yml &r&7config."
      - ""
      - "&r&7Use this as a template for your own"
      - "&r&7custom weapons, tools, and armor."
    unbreakable: true
    vanilla-enchants:
      sharpness: 5
      unbreaking: 3
    custom-enchants:
      lifesteal: 3
      execute: 2
    nbt:
      admin_item: frost_admin_blade
    # Usage:
    # /gi frost_admin_blade
    # /gi frostblade
    #
    # Loot table examples:
    # - id: frost_admin_blade
    # - item: frost_admin_blade
    #
    # Supported template fields here include:
    # material, name, lore, vanilla-enchants, custom-enchants, nbt,
    # unbreakable, keep-on-death, category, category-display, aliases
    #
    # Reward-style decorators also work on admin items:
    # enchantments, transmogged, essence, rune, heroic, protected,
    # holy_whitescroll / holy_water, soul_conduit, souls, soul_group

  luv_tomahawk:
