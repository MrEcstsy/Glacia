faction-core-claims:
  # The first /f claim a faction makes becomes its Core Chunk.
  # Normal claims must be connected so the faction base grows around the core instead of scattering.
  normal-require-adjacent: true
  raid:
    # Raid claims mark cannon source chunks. TNT fired from dispensers in these chunks can breach enemy core chunks.
    permanent: true
  premium:
    enabled: true
    # Premium claims are wilderness chunks beside this region.
    warzone-region: "Warzone"
    adjacent-chunk-distance: 1
    base-cost: 1000000
    increment-per-existing: 500000
    limit-per-faction: 3
  breach:
    minimum-y: 20
    cooldown-seconds: 28800
    tiers:
      - max-y: 100
        percent: 10
      - max-y: 150
        percent: 15
      - max-y: 250
        percent: 20
      - max-y: 255
        percent: 25

faction-guardian:
  # Factions stay hidden from /f top until their physical Chunk Guardian exists.
  require-for-ftop: true
  # If a faction is not created/placed during grace, the guardian is auto-placed after this long.
  place-deadline-seconds: 86400
  # TNT from raid claims can breach when it explodes in the guardian's chunk.
  breach-radius-chunks: 0
  # Guardian visuals only spawn when players are nearby.
  spawn-distance: 96
  despawn-distance: 112
  entity:
    scale: 0.55
    orbit-radius: 7.0
    orbit-height: 8.0
    orbit-speed: 0.035
    update-ticks: 2
