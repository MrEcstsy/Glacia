# Glacia Factions - in-game guide
# Reload after edits: /greload reload guide

main_menu_title: "&l&bGlacia &fGuide"
main_menu_content: "&7Learn the main loops: where to grind, how progression works, and what Glacia systems are actually for."

order:
  - getting_started
  - progression
  - zones
  - enchanting
  - factions
  - economy
  - pvp_warzone
  - farming
  - fishing
  - loot_crates
  - commands

