settings:
  # Placeholder for future toggles.
  enabled: true

voucher-defaults:
  voucher-material: paper
  voucher-name: "&r&l&eTitle Voucher &8- &r{display}"
  voucher-lore:
    - "&r&8Unlock Voucher"
    - ""
    - "&r&8Claim to permanently unlock:"
    - "&r{format}"
    - ""
    - "&r&8Status in /title:"
    - "&r&8LOCKED / UNLOCKED"

# Each title generates:
# - UI entry in /title
# - a voucher item id: title_voucher_<id>
# - permission grant on claim (default: glacia.title.<id>)
# Loot table example:
#   id: title_voucher
#   title: vlone
# You can also use title_id instead of title.
# Most titles only need display/format/description now.
titles:
  vlone:
    display: "&r&l&8[&r&cVlone&l&8]&r"
    format: "&r&l&8[&r&cVlone&l&8]&r"
    description: "&8Street legend."
