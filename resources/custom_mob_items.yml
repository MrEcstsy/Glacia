# ============================================================
# Glacia Custom Mob Items
# ============================================================
# These are sellable custom drops used by zone mobs.
#
# IMPORTANT FOR ADMINS:
# - The YAML key is the item identifier and is stored in NBT:
#     Glacia.custom_mob_item = "<identifier>"
#     Glacia.glaciaItem = "<identifier>"
# - Keep identifiers lowercase, stable, and simple:
#     allowed: a-z, 0-9, underscores
#     length: 3-48 characters
#   Good: azure_sinew, rift_ember, voidglass_shard
#   Bad: "My Item!!", "this name changes every week", spaces, color codes
# - If you rename an identifier later, old items already in player inventories
#   will keep the old NBT id and may no longer sell unless you keep that old id.
#
# Fields:
#   material: vanilla item id used as the visual base item
#   name: display name (supports color codes)
#   lore: item lore (supports color codes)
#   sell-price: money paid per item before sell multipliers

items:
  dewthread_sinew:
    material: string
    name: "&r&bDewthread Sinew"
