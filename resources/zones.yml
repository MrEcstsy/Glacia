nether-shortcut-zone: "infernal_rift"

zones:
  azure_plains:
    display: "&bAzure Plains"
    description: "&7Open, bright plains with simple terrain and a safer early-game feel."
    recommended-level: 1
    unlock-level: 1
    pvp-enabled: false
    world: "flat"
    x: 650
    y: 100
    z: 0
    radius: 325

  irondepths:
    display: "&8Irondepths"
    description: "&7Darker, enclosed caves and cliffs built for stronger mid-game grinding."
    recommended-level: 20
    unlock-level: 15
    pvp-enabled: false
    world: "crystal_cave"
    x: 1450
    y: 100
    z: 0
    radius: 0
    ore-regeneration:
      enabled: true
      respawn-seconds: 30
      replace-with-bedrock: true

  frostreach:
    display: "&fFrostreach"
    description: "&7Snow and ice with harsher terrain and less room to breathe."
    recommended-level: 40
    unlock-level: 35
    pvp-enabled: false
    world: "flat"
    x: 2350
    y: 100
    z: 0
    radius: 325

  infernal_rift:
    display: "&cInfernal Rift"
    description: "&7A scorched late-game rift with dangerous PvE and hotter pressure."
    recommended-level: 65
    unlock-level: 60
    world: "world_nether"
    x: 0
    y: 90
    z: 0
    full-world: true

  endfall:
    display: "&dAstral Veil"
    description: "&7A fractured celestial endgame zone where voidlight, relic energy, and unstable islands collide."
    recommended-level: 90
    unlock-level: 85
    pvp-enabled: true
    world: "end"
    x: 0
    y: 64
    z: 0
    full-world: true
    allow-flight: false
    exit:
      mode: "portal_only"
      bypass-permission: "glacia.staff"
      portal:
        enabled: true
        world: "end"
        pos1:
          x: -96
          y: 64
          z: -14
        pos2:
          x: -97
          y: 64
          z: -13
        teleport-seconds: 8
        hologram:
          enabled: true
          offset-y: 3.2
          lines:
            - "&r&d&lASTRAL GATE"
            - "&7Stand inside to leave Astral Veil"
            - "&fXP lowers the teleport time"
      destination:
        use-default-world-spawn: true
