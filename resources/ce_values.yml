  heroicarmor:
    # Heroic Upgrade Crystal success rate (%).
    upgrade-success-chance: 65

    # Independent "heroic armor" baseline (separate from full set bonuses).
    # Weighted like vanilla slot scaling, tuned to be stronger than diamond.
    helmet-reduction: 0.04
    chestplate-reduction: 0.10
    leggings-reduction: 0.08
    boots-reduction: 0.06
    total-reduction-cap: 0.32

    # Virtual durability buffer consumed before real item durability.
    # Effective durability = vanilla leather durability + heroic buffer.
    helmet-buffer-max: 910
    chestplate-buffer-max: 1000
    leggings-buffer-max: 935
    boots-buffer-max: 686

    # PvP durability reinforcement chances (refund 1 durability on hit).
    helmet-durability-refund-chance: 45
    chestplate-durability-refund-chance: 65
    leggings-durability-refund-chance: 55
    boots-durability-refund-chance: 50
