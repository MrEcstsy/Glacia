# ============================================================
# Glacia Custom Enchant Tuning (ce_values.yml)
# ============================================================
# This file controls CE balance without code edits.
# After changes, run /greload cevalues (or /greload).
#
# Core rules:
# - Percent chances use whole-number percent values.
#   Example: 25 = 25% proc chance.
# - Flat "chance-by-level" values are direct per-level chances.
# - If an enchant has both "base-chance" and "chance-by-level",
#   the enchant code decides how those values combine (varies by enchant).
#
# Units and scaling:
# - Health/heal/damage values are in HALF-HEART units used by PMMP health.
#   Example: 1.0 = half-heart, 2.0 = 1 full heart, 10.0 = 5 hearts.
# - trigger-health-percent uses 0.0-1.0 decimal scale.
#   Example: 0.30 = 30% HP threshold.
# - Any "-seconds" value is seconds.
# - cooldown values are seconds unless a key explicitly says ticks.
# - Effect amplifiers are zero-based.
#   Example: 0 = Effect I, 1 = Effect II, 2 = Effect III.
#
# Proc-luck (anti-dry-streak helper):
# - enabled: true/false per enchant.
# - luck-per-miss: chance bonus added after each failed proc.
# - max-bonus: max extra chance that can be stacked from misses.
#
# Per-level maps:
# - Use string level keys ("1", "2", "3", ...).
# - Missing levels usually fall back to nearest/default in code.
# - Keep level progression monotonic unless you intentionally want spikes.
#
# Advanced / “new set” enchants (triadward … ironmuzzle):
# - For many procs, the PHP pass gives a per-hit base chance; ce_values "base-chance" is NOT
#   used unless the enchant is wired to it. Tuning is mostly proc-luck and the scalars below.
# - "luck-per-miss" and "max-bonus" should match the defaults passed to ProcLuckManager::roll
#   in AdvancedSetEnchants (see code) unless you intentionally soften or harden dry streaks.
# - runeswell: "axe-proc-bonus-per-level" adds to axe proc % (per Runeswell level).
# - strategist: "koth-capture-bonus-per-level" adds to each KOTH tick when boots have Strategist.
# - aureateburden: gap "sickness" cooldown is gap-sickness-cooldown-seconds + extra (see that block).
#
# Conflicts:
# - conflicts-with is a list of enchant keys that cannot be applied together.
# - Example: conflicts-with: ["blind", "slowness"]
#
# Safe tuning tips:
# - Increase in small steps (1-3% chance or small numeric increments).
# - Test one enchant at a time, then /greload cevalues and re-test.
#
settings:
  version: 2
  # Warm-up: first N hits (random between min and max, per attacker + target) do not roll
  # custom enchant procs on the attacking weapon. Victim armor / defensive procs are unchanged.
  weapon-proc-gate:
    enabled: true
    min-hits: 3
    max-hits: 5

  # Enchants in this list cannot be rolled from Mastery random books.
  # They can still be obtained through direct sources (kits/gkits/loot etc).
  mastery-book-disabled-enchants: []

  # Charm upgrade system.
  charm-upgrades:
    shard-base-success: 70
    dust-bonus-default: 5
    # Book-consume (tinkering) reward roll when an enchantment book is used up.
    tinkerer-roll-chance: 12
    tinkerer-shard-weight: 40
    tinkerer-dust-weight: 60
    shard-success-min: 50
    shard-success-max: 80
    dust-bonus-min: 3
    dust-bonus-max: 8

