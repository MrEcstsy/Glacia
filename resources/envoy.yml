enabled: true
interval: "2h"
duration: "20m"
crate-count: 10
spawn-attempts: 120
indicator-interval: "12s"

broadcasts:
  start: "&r&l&bEnvoy &8| &r&f{count} envoy crates have landed in &bWarzone&f for &b{time}&f."
  end: "&r&l&bEnvoy &8| &r&7The envoy event has ended."

special-event:
  enabled: true
  interval: "8h"
  initial-delay: "3h"
  duration: "1h"
  crate-count-multiplier: 0.6
  broadcasts:
    start: "&r&l&dWorld Event &8| &r&fFor the next &d{time}&f, envoys will only spawn as &dExotic&f, &6Legendary&f, or &5Godly&f crates, with fewer crates than usual."
    end: "&r&l&dWorld Event &8| &r&7The exotic envoy surge has ended."
  types:
    exotic: 45
    legendary: 35
    godly: 20

types:
  simple:
    enabled: true
    chance: 33
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_simple_chest"

  unique:
    enabled: true
    chance: 22
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_unique_chest"

  elite:
    enabled: true
    chance: 17
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_elite_chest"

  exotic:
    enabled: true
    chance: 11
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_exotic_chest"

  legendary:
    enabled: true
    chance: 12
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_legendary_chest"

  godly:
    enabled: false
    chance: 5
    reward-count: 1
    rewards:
      - chance: 100
        type: item
        id: "ethereal_godly_chest"
