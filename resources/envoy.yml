enabled: true
interval: "2h"
duration: "20m"
crate-count: 10
spawn-attempts: 120
indicator-interval: "12s"

broadcasts:
  start: "&r&l&bEnvoy &8| &r&f{count} envoy crates have landed in &bWarzone&f for &b{time}&f."
  end: "&r&l&bEnvoy &8| &r&7The envoy event has ended."

types:
  simple:
    enabled: true
    chance: 35
    reward-count: 1
    rewards:
      - chance: 40
        type: item
        id: "simplebook"
      - chance: 20
        type: item
        id: "simpledust"
        percent: "{3-8}"
        count: "{2-4}"
      - chance: 20
        type: item
        id: "bank_note"
        amount: "{25000-60000}"
      - chance: 20
        type: item
        id: "xpnote"
        amount: "{5000-12000}"

  unique:
    enabled: true
    chance: 25
    reward-count: 1
    rewards:
      - chance: 35
        type: item
        id: "uniquebook"
      - chance: 20
        type: item
        id: "whitescroll"
      - chance: 20
        type: item
        id: "bank_note"
        amount: "{75000-125000}"
      - chance: 25
        type: item
        id: "xpnote"
        amount: "{10000-20000}"

  elite:
    enabled: true
    chance: 18
    reward-count: 1
    rewards:
      - chance: 30
        type: item
        id: "elitebook"
      - chance: 20
        type: item
        id: "blackscroll"
        success: "{85-100}"
      - chance: 20
        type: item
        id: "mysterymobspawner"
      - chance: 30
        type: item
        id: "bank_note"
        amount: "{150000-350000}"

  legendary:
    enabled: true
    chance: 15
    reward-count: 2
    rewards:
      - chance: 30
        type: item
        id: "legendarybook"
      - chance: 15
        type: item
        id: "heroic_mysterymobspawner"
      - chance: 25
        type: item
        id: "chunk_buster"
      - chance: 30
        type: item
        id: "bank_note"
        amount: "{500000-1000000}"

  heroic:
    enabled: true
    chance: 7
    reward-count: 2
    rewards:
      - chance: 30
        type: item
        id: "heroic_slot_ticket"
      - chance: 20
        type: item
        id: "heroic_mysterymobspawner"
      - chance: 20
        type: item
        id: "collection_chest"
      - chance: 30
        type: item
        id: "bank_note"
        amount: "{1000000-2500000}"
