settings:
  enabled: true
  default-edge-padding: 10
  start-broadcast: "&r&l&bWorld Event &8| &r{event} &7has begun in &f{zone}&7 for &b{duration}&7."
  end-broadcast: "&r&l&bWorld Event &8| &r{event} &7has ended in &f{zone}&7."

global-events:
  warzone_boss:
    enabled: true
    interval-seconds:
      min: 14400
      max: 21600
    initial-delay-seconds: 5400
    duration-seconds: 1800
    spawn-attempts: 32
    broadcasts:
      start: "&r&l&dWorld Event &8| &r&f{boss} &7has spawned in &cWarzone &7at &f{coords} &7for &f{time}&7."
      end: "&r&l&dWorld Event &8| &r&7The &f{boss} &7warzone event has ended."
    bosses:
      - id: astral_devourer
        weight: 1
      - id: titan_knight
        weight: 1
      - id: glacial_hydra
        weight: 1

zones:
  frostreach:
    enabled: true
    interval-seconds:
      min: 10800
      max: 14400
    initial-delay-seconds: 1800
    events:
      froststorm:
        enabled: true
        display: "&bFroststorm"
        weight: 1
        duration-seconds: 1200
        spawn-multiplier: 2.0
        kill-progress-per-kill: 2
        loot-multiplier: 1.15
        mob-stat-multipliers:
          health: 1.08
          damage: 1.12
          speed: 1.08
          xp: 1.15
        ambient:
          particle: packed_ice
          particles-per-tick: 1
          particle-chance-percent: 35
          min-distance: 7
          max-distance: 14
          min-y-offset: 0.8
          max-y-offset: 3.0
          sound: ambient.weather.rain
          sound-interval-seconds: 38
          sound-chance-percent: 25
          sound-volume: 0.08
          sound-pitch: 0.82
          sound-pitch-jitter: 0.05
        mob-behavior:
          teleport-chance: 0
        extra-mobs:
          frozen_wisp:
            entity: slime
            display: "&bFrozen Wisp"
            health: 105
            damage: 15
            speed: 0.27
            target-range: 17
            attack-reach: 2.0
            melee-cooldown: 10
            xp: 88
            weight: 24
            rewards:
              - chance: 28
                type: item
                id: glacial_heartchip
                count: 1
                broadcast: "&r&b{player} &7pulled &f{item} &7from a &bFroststorm &7mob in &f{zone}&7."
        extra-rewards:
          - chance: 5
            type: item
            id: simplebook
            count: 1
            broadcast: "&r&b{player} &7found &f{item} &7during &b{event} &7in &f{zone}&7."
        nodes:
          enabled: true
          display: "Frozen Crystal Node"
          block: blue_ice
          max-active: 10
          spawn-interval-seconds: 35
          spawn-attempts: 8
          rewards:
            - type: item
              id: glacial_heartchip
              count: "1-2"
              broadcast: "&r&b{player} &7mined a &f{node} &7and uncovered &f{item} &7in &f{zone}&7."
            - type: item
              id: rimebound_fang
              count: "3-6"
        boss:
          enabled: true
          spawn-chance: 20
          mob-id: storm_herald
          display: "&r&l&bStorm Herald"
          entity: iron_golem
          health: 420
          damage: 28
          speed: 0.24
          target-range: 20
          attack-reach: 2.8
          melee-cooldown: 10
          xp: 260
          rewards:
            - type: item
              id: glacial_heartchip
              count: "3-5"
            - type: item
              id: simplebook
              count: "1-2"
          broadcast: "&r&6Boss Alert &8| &r{event} &7has awakened &f{boss} &7inside &f{zone} &7at &f{coords}&7."

  endfall:
    enabled: true
    interval-seconds:
      min: 12600
      max: 16200
    initial-delay-seconds: 2700
    events:
      astral_fracture:
        enabled: true
        display: "&dAstral Fracture"
        weight: 1
        duration-seconds: 1200
        spawn-multiplier: 1.55
        kill-progress-per-kill: 2
        loot-multiplier: 1.2
        mob-stat-multipliers:
          health: 1.05
          damage: 1.12
          speed: 1.08
          xp: 1.18
        ambient:
          particle: astral
          particles-per-tick: 1
          particle-chance-percent: 22
          min-distance: 8
          max-distance: 15
          min-y-offset: 1.0
          max-y-offset: 4.0
        mob-behavior:
          teleport-chance: 16
        extra-mobs:
          fractured_echo:
            entity: enderman
            display: "&5Fractured Echo"
            health: 250
            damage: 29
            speed: 0.3
            target-range: 20
            attack-reach: 2.8
            melee-cooldown: 9
            xp: 210
            weight: 22
            rewards:
              - chance: 32
                type: item
                id: voidglass_shard
                count: "1-2"
              - chance: 6
                type: item
                id: simplebook
                count: 1
                broadcast: "&r&d{player} &7tore a &f{item} &7out of a &dFractured Echo &7in &f{zone}&7."
        extra-rewards:
          - chance: 5
            type: item
            id: endfallen_relic
            count: 1
            broadcast: "&r&d{player} &7secured &f{item} &7during &d{event} &7in &f{zone}&7."
        nodes:
          enabled: true
          display: "Floating Shard"
          block: amethyst_block
          max-active: 8
          spawn-interval-seconds: 40
          spawn-attempts: 8
          rewards:
            - type: item
              id: voidglass_shard
              count: "1-3"
            - type: item
              id: endfallen_relic
              count: 1
              broadcast: "&r&d{player} &7cracked a &f{node} &7and uncovered &f{item} &7in &f{zone}&7."
        boss:
          enabled: true
          spawn-chance: 15
          mob-id: astral_revenant
          display: "&r&l&5Astral Revenant"
          entity: enderman
          health: 500
          damage: 32
          speed: 0.31
          target-range: 22
          attack-reach: 3.0
          melee-cooldown: 9
          xp: 320
          rewards:
            - type: item
              id: endfallen_relic
              count: "2-4"
            - type: item
              id: simplebook
              count: "1-2"
          broadcast: "&r&6Boss Alert &8| &r{event} &7has awakened &f{boss} &7inside &f{zone} &7at &f{coords}&7."

  infernal_rift:
    enabled: true
    interval-seconds:
      min: 10800
      max: 14400
    initial-delay-seconds: 3600
    events:
      infernal_surge:
        enabled: true
        display: "&cInfernal Surge"
        weight: 1
        duration-seconds: 1200
        spawn-multiplier: 1.6
        kill-progress-per-kill: 2
        loot-multiplier: 1.2
        mob-stat-multipliers:
          health: 1.08
          damage: 1.18
          speed: 1.12
          xp: 1.2
        ambient:
          particle: flame
          particles-per-tick: 1
          particle-chance-percent: 40
          min-distance: 7
          max-distance: 13
          min-y-offset: 0.4
          max-y-offset: 2.0
          sound: random.fizz
          sound-interval-seconds: 28
          sound-chance-percent: 35
          sound-volume: 0.12
          sound-pitch: 0.76
          sound-pitch-jitter: 0.08
        extra-rewards:
          - chance: 7
            type: item
            id: emberbrand_scale
            count: 1
            broadcast: "&r&c{player} &7pulled &f{item} &7out of an &cInfernal Surge &7mob in &f{zone}&7."
        nodes:
          enabled: true
          display: "Magma Crack"
          block: magma
          max-active: 8
          spawn-interval-seconds: 35
          spawn-attempts: 8
          rewards:
            - type: item
              id: emberbrand_scale
              count: "1-2"
            - type: item
              id: rift_ash
              count: "2-4"
        boss:
          enabled: true
          spawn-chance: 18
          mob-id: ember_colossus
          display: "&r&l&6Ember Colossus"
          entity: iron_golem
          health: 560
          damage: 34
          speed: 0.25
          target-range: 19
          attack-reach: 2.9
          melee-cooldown: 10
          xp: 340
          rewards:
            - type: item
              id: emberbrand_scale
              count: "3-5"
            - type: item
              id: simplebook
              count: "1-2"
          broadcast: "&r&6Boss Alert &8| &r{event} &7has awakened &f{boss} &7inside &f{zone} &7at &f{coords}&7."

  azure_plains:
    enabled: true
    interval-seconds:
      min: 9000
      max: 12600
    initial-delay-seconds: 2400
    events:
      bloom_event:
        enabled: true
        display: "&aBloom Event"
        weight: 1
        duration-seconds: 1500
        spawn-multiplier: 1.0
        kill-progress-per-kill: 1
        loot-multiplier: 1.0
        ambient:
          particle: bloom
          particles-per-tick: 1
          particle-chance-percent: 28
          min-distance: 8
          max-distance: 15
          min-y-offset: 0.8
          max-y-offset: 3.0
        economy:
          sell-multiplier: 1.25
        fishing:
          enabled: true
          uncommon-chance-multiplier: 1.1
          rare-chance-multiplier: 1.5
          epic-chance-multiplier: 1.8
          extra-rewards:
            - chance: 4
              type: money_note
              amount: "2500-6000"
              rarity: rare
              broadcast: "&r&a{player} &7reeled in &f{item} &7during &a{event}&7."
            - chance: 1
              type: item
              id: simplebook
              rarity: epic
              broadcast: "&r&a{player} &7hooked &f{item} &7during &a{event}&7."
        crop-growth:
          enabled: true
          radius: 5
          per-block-chance: 24
          growth-steps: 1
